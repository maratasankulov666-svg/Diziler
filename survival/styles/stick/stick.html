<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><script type="module">
// Кадры стиля «стикмен на подробном фоне». ?shot=имя
import { drawStick, propBox } from './stickman.js';
import { drawAisle, drawEntrance, drawParking } from './bgcode.js';
const c = document.getElementById('c').getContext('2d');
const shot = new URLSearchParams(location.search).get('shot') || 'aisle';
const img = src => new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; });
async function bg(name) {
  if (name === 'aisle') return drawAisle(c); if (name === 'entrance') return drawEntrance(c); if (name === 'parking') return drawParking(c);
  const i = await img('bg/' + name + '.png'); if (i) c.drawImage(i, 0, 0, 1280, 720); else { c.fillStyle = '#333'; c.fillRect(0, 0, 1280, 720); }
}
const S = {
  aisle:      async () => { await bg('aisle'); drawStick(c, 560, 660, 52, { mood: 'determined', armL: [-2.3, 0.2], armR: [0.35, 1.0], propR: propBox, look: [-5, -3], tilt: -0.08 }); },
  aisle_close:async () => { await bg('aisle'); drawStick(c, 640, 1180, 150, { mood: 'worried', armL: [0.3, 0.2], armR: [-0.3, -0.1], look: [-6, 0] }); },
  entrance:   async () => { await bg('entrance'); drawStick(c, 640, 470, 15, { outfit: 'worker', mood: 'worried' }); drawStick(c, 330, 700, 58, { mood: 'scared', armL: [-0.35, 2.97], armR: [0.35, -2.97], look: [5, -2], tilt: 0.06 }); },
  parking:    async () => { await bg('parking'); drawStick(c, 560, 690, 54, { outfit: 'worker', mood: 'worried', armL: [0.5, 0.4], armR: [-0.6, -0.3], look: [5, 0] });
    drawStick(c, 830, 715, 64, { mood: 'neutral', armL: [0.3, 0.15], armR: [-0.3, -0.15], look: [-6, 0] }); drawStick(c, 470, 520, 22, { outfit: 'green', mood: 'worried' }); drawStick(c, 760, 505, 20, { outfit: 'green', mood: 'tired' }); },
  ai_aisle:   async () => { await bg('bg_aisle'); drawStick(c, 520, 650, 50, { mood: 'determined', armL: [-2.3, 0.2], armR: [0.35, 1.0], propR: propBox, look: [-5, -3] }); },
  ai_entrance:async () => { await bg('bg_entrance'); drawStick(c, 640, 700, 75, { outfit: 'worker', mood: 'worried', armL: [0.25, 0.1], armR: [-0.25, -0.1], legL: [0.12, -0.25], legR: [-0.12, 0.25] }); },
  ai_parking: async () => { await bg('bg_parking'); drawStick(c, 470, 690, 52, { outfit: 'worker', mood: 'worried', armL: [0.5, 0.4], armR: [-0.6, -0.3] });
    drawStick(c, 900, 720, 62, { mood: 'neutral', armL: [0.4, 0.2], armR: [-1.1, -0.6], look: [-6, 0] }); drawStick(c, 260, 560, 30, { outfit: 'green', mood: 'worried' }); drawStick(c, 1090, 560, 30, { outfit: 'green', mood: 'tired' }); },
};
await S[shot]();
window.READY = true;
</script></body></html>
