<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Playfair+Display:ital,wght@1,700;1,900&display=swap" rel="stylesheet">
<style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(bed_bg6.png) center/cover}
.bg{left:420px !important}.l{position:absolute;left:0;top:0;width:720px;height:720px;background:url(L6.png) center/cover;-webkit-mask-image:linear-gradient(to right,#000 62%,transparent 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 35%,rgba(0,0,0,0) 45%,rgba(0,0,0,.45) 100%)}
svg{position:absolute;left:0;bottom:0}

   text-shadow:0 3px 0 rgba(4,40,52,.9),0 6px 22px rgba(0,0,0,.8)}
.t .a{font-weight:700;font-size:96px;line-height:1;letter-spacing:.01em}

   font-size:52px;line-height:.92;text-align:right;text-shadow:0 2px 0 rgba(0,0,0,.6),0 4px 18px rgba(0,0,0,.85)}
</style></head><body>
<div class="bg"></div><div class="l"></div><div class="vig"></div><div style="position:absolute;inset:0;background:radial-gradient(circle at 57% 28%,rgba(255,236,210,.38) 0%,rgba(255,220,190,.12) 18%,rgba(0,0,0,0) 34%);mix-blend-mode:screen"></div>
<div style="position:absolute;inset:0;background:radial-gradient(ellipse 46% 62% at 57% 32%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)"></div>
<div style="position:absolute;left:0;top:0;width:520px;height:720px;background:linear-gradient(to right,rgba(0,0,0,.35),rgba(0,0,0,0))"></div>
<svg width="1280" height="330" viewBox="0 0 1280 330">
 <defs>
  <linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fd0dc" stop-opacity=".55"/>
   <stop offset=".35" stop-color="#1a9aae" stop-opacity=".88"/><stop offset="1" stop-color="#05303e" stop-opacity="1"/></linearGradient>
  <linearGradient id="w2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe6ef" stop-opacity=".5"/><stop offset="1" stop-color="#0b5566" stop-opacity=".9"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="2"/></filter>
 </defs>
 <path d="M0 150 C 140 110, 260 175, 420 140 S 700 95, 860 145 S 1120 175, 1280 120 L1280 330 L0 330 Z" fill="url(#w2)"/>
 <path d="M0 175 C 180 140, 330 205, 520 170 S 860 130, 1020 178 S 1200 200, 1280 165 L1280 330 L0 330 Z" fill="url(#w)"/>
 <path d="M0 175 C 180 140, 330 205, 520 170 S 860 130, 1020 178 S 1200 200, 1280 165" stroke="#f2feff" stroke-width="6" fill="none" opacity=".85" filter="url(#blur)"/>
 <path d="M0 150 C 140 110, 260 175, 420 140 S 700 95, 860 145 S 1120 175, 1280 120" stroke="#e8fcff" stroke-width="3" fill="none" opacity=".6"/>
 <g id="spray" fill="#fff"></g>
</svg>
<div class="logo">Taşacak<br>Bu<br>Deniz</div>
<div class="t"><div class="a">40. BÖLÜM</div><div class="b">FRAGMANI</div></div>
<script>
// deterministic foam spray along the wave crest
let s=7;const r=()=>(s=(s*16807)%2147483647)/2147483647;const g=document.getElementById('spray');
for(let i=0;i<420;i++){const x=r()*1280;const crest=165+Math.sin(x/170)*22;const y=crest-10+(r()-.6)*70;
 const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',x);c.setAttribute('cy',y);
 c.setAttribute('r',(r()*r()*4+.6).toFixed(2));c.setAttribute('opacity',(r()*.7+.2).toFixed(2));g.appendChild(c);}
</script>
</body></html>
