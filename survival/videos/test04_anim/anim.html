<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><script type="module">
import { setup, frame } from './scene.js';
const cv = document.getElementById('c'), c = cv.getContext('2d');
window.init = async () => { const ws = await (await fetch('words.json')).json(); return setup(ws); };
window.shot = (t, q = 0.9) => { frame(c, t); return cv.toDataURL('image/jpeg', q); };
window.READY = true;
</script></body></html>
