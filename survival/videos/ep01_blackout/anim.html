<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../../styles/thumb/fonts/Anton-Regular.ttf)}
html,body{margin:0;background:#000}canvas{display:block}</style></head>
<body><canvas id="c" width="1280" height="720"></canvas><script type="module">
import { setup, frame } from './scene.js';
const cv = document.getElementById('c'), c = cv.getContext('2d');
window.init = async () => { await document.fonts.load('40px Anton'); const p = await (await fetch('plan.json?' + Date.now())).json(); setup(p); return { duration: p.duration }; };
window.shot = (t, q = 0.9) => { frame(c, t); return cv.toDataURL('image/jpeg', q); };
window.READY = true;
</script></body></html>
